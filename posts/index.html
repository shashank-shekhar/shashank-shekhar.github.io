<head>
  <meta charset="UTF-8">
  <script>
	(function () {
		try {
			var t = localStorage.getItem('monadic-theme');
			if (t !== 'light' && t !== 'dark') {
				t =
					window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
						? 'dark'
						: 'light';
			}
			document.documentElement.setAttribute('data-color-scheme', t);
			if (t === 'dark') {
				document.documentElement.classList.add('dark');
			}
		} catch (e) {
			/* localStorage/matchMedia unavailable — leave the default scheme */
		}
	})();
</script>
